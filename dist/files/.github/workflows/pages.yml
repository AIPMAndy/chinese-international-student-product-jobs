name: Deploy verified guide to GitHub Pages
# Official GitHub Pages action versions checked on 2026-11-13.
# Regenerate current website and downloads from source. Reuse reviewed PDF unchanged.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'AIPMAndy/chinese-international-student-product-jobs' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the committed project
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned site build dependency
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Repackage complete source (including standalone home) and build current Pages artifact
        run: |
          python3 tools/package_release.py --require-pdf
          npm run build
      - name: Verify current release integrity
        run: python3 tools/check_integrity.py
      - name: Verify all published chapter metadata and downloadable PDF
        run: python3 tools/check_seo.py
      - name: Validate generated static site and downloads
        run: python3 tools/check_pages_links.py --require downloads/product-jobs-guide-v1.0.0.pdf --require downloads/product-jobs-workbook-v1.0.0.zip --require downloads/product-jobs-source-v1.0.0.zip
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the verified static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML, assets and downloads
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import time
          from pathlib import Path
          from urllib.request import Request, urlopen

          base = os.environ['LIVE_URL'].rstrip('/') + '/'
          paths = ["index.html","chapters/00-start-here.html","assets/home.css","assets/home.js","downloads/product-jobs-guide-v1.0.0.pdf","downloads/product-jobs-workbook-v1.0.0.zip","downloads/product-jobs-source-v1.0.0.zip"]
          for path in paths:
              expected = (Path('dist') / path).read_bytes()
              expected_hash = hashlib.sha256(expected).hexdigest()
              url = base + path
              for attempt in range(8):
                  try:
                      request = Request(url, headers={'User-Agent': 'Andy-Guide-Pages-Verification/1.0', 'Accept-Encoding': 'identity', 'Cache-Control': 'no-cache'})
                      with urlopen(request, timeout=20) as response:
                          data = response.read()
                          status = response.status
                      actual_hash = hashlib.sha256(data).hexdigest()
                      if status != 200 or actual_hash != expected_hash:
                          raise RuntimeError(f'Published file differs from committed dist: {url}; HTTP {status}')
                      print('HTTP VERIFIED ' + json.dumps({'url': url, 'status': status, 'bytes': len(data), 'sha256': actual_hash}), flush=True)
                      break
                  except Exception as exc:
                      if attempt == 7:
                          raise
                      print(f'Retry {attempt + 1}/8 for {url}: {exc}', flush=True)
                      time.sleep(3)
          PY
