<text x="61" y="108" font-size="12" fill="#78896b">01 / INPUT</text><text x="61" y="144" font-size="23">原始材料与反例</text><text x="61" y="178" font-size="15" fill="#697960">来源、授权、观察与推断分栏</text>
<text x="569" y="108" font-size="12" fill="#78896b">02 / DECISION</text><text x="569" y="144" font-size="23">问题定义与方案取舍</text><text x="569" y="178" font-size="15" fill="#697960">比较替代办法，保留改变决定的条件</text>
<text x="569" y="313" font-size="12" fill="#78896b">03 / DELIVERY</text><text x="569" y="349" font-size="23">原型、指标与推进计划</text><text x="569" y="383" font-size="15" fill="#697960">能操作、能验收、知道哪些未验证</text>
<text x="61" y="313" font-size="12" fill="#78896b">04 / APPLICATION</text><text x="61" y="349" font-size="23">作品集、简历与面试</text><text x="61" y="383" font-size="15" fill="#697960">同一组事实，按岗位重排证据</text>
