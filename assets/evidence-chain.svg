<rect width="1000" height="460" fill="#f7f9f2"/><g font-family="Noto Sans CJK SC,Arial,sans-serif" fill="#253b2c"><text x="36" y="42" font-size="13" letter-spacing="2">PRODUCT EVIDENCE / 教学案例结构</text>
<g fill="#fff" stroke="#ccd6c2"><rect x="36" y="75" width="420" height="130" rx="9"/><rect x="544" y="75" width="420" height="130" rx="9"/><rect x="36" y="280" width="420" height="130" rx="9"/><rect x="544" y="280" width="420" height="130" rx="9"/></g>
