name: Browser QA · product job workbench
on:
  push:
    branches: [main]
    paths:
      - 'site/home.html'
      - 'assets/home.js'
      - 'assets/home.css'
      - 'assets/site.css'
      - 'assets/source-review.js'
      - 'tools/source_audit.mjs'
      - 'tools/check_seo.py'
      - 'research/jobs-sources.json'
      - 'tools/build_site.mjs'
      - 'tests/browser_smoke.cjs'
      - '.github/workflows/browser-qa.yml'
  pull_request:
    paths:
      - 'site/home.html'
      - 'assets/source-review.js'
      - 'assets/site.css'
      - 'tools/source_audit.mjs'
      - 'tools/build_site.mjs'
      - 'tools/check_seo.py'
      - 'research/jobs-sources.json'
      - 'tests/browser_smoke.cjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    if: github.repository == 'AIPMAndy/chinese-international-student-product-jobs'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned site and browser dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm install --no-save --ignore-scripts --no-audit --no-fund --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Rebuild from authoritative HTML, CSS and JS
        run: |
          python3 tools/package_release.py --require-pdf
          npm run build
          python3 tools/check_integrity.py
          python3 tools/check_seo.py
          python3 tools/check_pages_links.py --require downloads/product-jobs-guide-v1.0.0.pdf
          node --check assets/home.js
          node --check assets/source-review.js
      - name: Test Chromium at 360 / 390 / 1280px
        run: node tests/browser_smoke.cjs
